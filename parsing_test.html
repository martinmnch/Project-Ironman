<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parsing Test</title>
  <style>body{font-family:Arial,sans-serif;padding:24px;background:#f7f6f2;color:#222}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:16px}pre{white-space:pre-wrap;background:#111;color:#0f0;padding:16px;border-radius:12px;overflow:auto}</style>
</head>
<body>
  <div class="card"><h1>Parsing Test</h1><div id="status">Lade...</div></div>
  <div class="card"><strong>Rows JSON:</strong><pre id="rows">...</pre></div>
  <script>
    const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdb2-l0kfOwOvL2A2zBL7t_A5_P2tdnndYSK4zoc8Z_DAuvKgODHflE0z7UkonAeQDVujijpg4opp/pub?gid=0&single=true&output=csv';
    function parseCSV(text){
      const rows=[]; let cur='', row=[], q=false;
      for(let i=0;i<text.length;i++){
        const c=text[i], n=text[i+1];
        if(c==='"'&&q&&n==='"'){cur+='"'; i++; continue;}
        if(c==='"'){q=!q; continue;}
        if(c===','&&!q){row.push(cur); cur=''; continue;}
        if((c==='\n'||c==='\r')&&!q){ if(c==='\r'&&n==='\n') continue; row.push(cur); rows.push(row); row=[]; cur=''; continue; }
        cur+=c;
      }
      if(cur.length||row.length){ row.push(cur); rows.push(row); }
      return rows.filter(r=>r.some(v=>String(v).trim()!==''));
    }
    fetch(URL + '&_=' + Date.now())
      .then(r => r.text())
      .then(t => {
        const rows = parseCSV(t);
        document.getElementById('status').textContent = 'Zeilen: ' + rows.length + ' | erste Zeile: ' + JSON.stringify(rows[0]);
        document.getElementById('rows').textContent = JSON.stringify(rows, null, 2);
      })
      .catch(e => { document.getElementById('status').textContent = 'FEHLER: ' + e.message; });
  </script>
</body>
</html>
