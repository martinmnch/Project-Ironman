<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV Test</title>
  <style>body{font-family:Arial,sans-serif;padding:24px;background:#f7f6f2;color:#222}pre{white-space:pre-wrap;background:#111;color:#0f0;padding:16px;border-radius:12px;overflow:auto} .card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:16px}</style>
</head>
<body>
  <div class="card"><h1>CSV Load Test</h1><div id="status">Lade...</div></div>
  <div class="card"><strong>Rohtext:</strong><pre id="raw">...</pre></div>
  <div class="card"><strong>Zeilen:</strong><pre id="rows">...</pre></div>
  <script>
    const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrdb2-l0kfOwOvL2A2zBL7t_A5_P2tdnndYSK4zoc8Z_DAuvKgODHflE0z7UkonAeQDVujijpg4opp/pub?gid=0&single=true&output=csv';
    fetch(URL + '&_=' + Date.now(), {cache:'no-store'})
      .then(r => r.text().then(t => ({r,t})))
      .then(({r,t}) => {
        document.getElementById('status').textContent = 'HTTP ' + r.status + ' ' + r.statusText;
        document.getElementById('raw').textContent = t;
        document.getElementById('rows').textContent = JSON.stringify(t.split(/\r?\n/), null, 2);
      })
      .catch(e => {
        document.getElementById('status').textContent = 'FEHLER: ' + e.message;
        document.getElementById('raw').textContent = '';
      });
  </script>
</body>
</html>
