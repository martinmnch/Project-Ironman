<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swim Coach Dashboard</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <style>
    :root,[data-theme="light"]{
      --bg:#f7f6f2;
      --surface:#f9f8f5;
      --surface-2:#fbfbf9;
      --surface-offset:#f3f0ec;
      --divider:#dcd9d5;
      --text:#28251d;
      --muted:#6f6d68;
      --inverse:#f9f8f4;
      --primary:#01696f;
      --primary-hover:#0c4e54;
      --primary-highlight:#cedcd8;
      --radius-lg:.75rem;
      --radius-xl:1rem;
      --radius-full:9999px;
      --shadow-sm:0 1px 2px oklch(0.2 0.01 80 / 0.06);
      --font-body:'Satoshi',Inter,sans-serif;
      --t:180ms cubic-bezier(.16,1,.3,1)
    }
    [data-theme="dark"]{
      --bg:#171614;
      --surface:#1c1b19;
      --surface-2:#201f1d;
      --surface-offset:#1d1c1a;
      --divider:#262523;
      --text:#cdccca;
      --muted:#9a9996;
      --inverse:#2b2a28;
      --primary:#4f98a3;
      --primary-hover:#227f8b;
      --primary-highlight:#313b3b;
      --shadow-sm:0 1px 2px oklch(0 0 0 / 0.2)
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{
      min-height:100dvh;
      line-height:1.55;
      font-family:var(--font-body);
      font-size:16px;
      color:var(--text);
      background:var(--bg)
    }
    button{cursor:pointer;border:none;background:none}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:.375rem}
    .dashboard{
      display:grid;
      grid-template-columns:280px 1fr;
      grid-template-rows:72px 1fr;
      height:100dvh
    }
    .sidebar{
      grid-row:1 / -1;
      overflow-y:auto;
      background:linear-gradient(180deg,var(--surface),var(--surface-offset));
      border-right:1px solid color-mix(in oklab,var(--text) 10%, transparent);
      padding:24px
    }
    .header{
      grid-column:2;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:0 24px;
      border-bottom:1px solid color-mix(in oklab,var(--text) 10%, transparent);
      background:color-mix(in oklab,var(--bg) 86%, transparent);
      backdrop-filter:blur(14px)
    }
    .main{
      grid-column:2;
      overflow-y:auto;
      padding:24px;
      display:grid;
      gap:24px
    }
    .logo-wrap{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:32px
    }
    .logo{width:40px;height:40px;color:var(--primary)}
    .brand h1{font-size:18px;line-height:1.1}
    .brand p,.muted{font-size:14px;color:var(--muted)}
    .nav-group{
      display:grid;
      gap:8px;
      margin-bottom:24px
    }
    .nav-link{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      border-radius:12px;
      font-size:14px;
      color:var(--muted);
      transition:all var(--t)
    }
    .nav-link.active,.nav-link:hover{
      background:var(--primary-highlight);
      color:var(--text)
    }
    .panel,.card{
      background:var(--surface);
      border:1px solid color-mix(in oklab,var(--text) 10%, transparent);
      border-radius:16px;
      box-shadow:var(--shadow-sm)
    }
    .panel{padding:20px}
    .page-title{
      font-size:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      line-height:1.05;
      font-weight:900;
      letter-spacing:-.03em
    }
    .kpis{
      display:grid;
      gap:24px;
      grid-template-columns:repeat(4,minmax(0,1fr))
    }
    .kpi{padding:20px}
    .kpi .label{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:var(--muted)
    }
    .kpi .value{
      font-size:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      font-weight:900;
      line-height:1.05;
      margin-top:8px;
      font-variant-numeric:tabular-nums lining-nums
    }
    .kpi .sub{
      font-size:14px;
      color:var(--muted);
      margin-top:8px
    }
    .content-grid{
      display:grid;
      gap:24px;
      grid-template-columns:1.25fr .9fr
    }
    .panel-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:20px
    }
    .panel-head h2{font-size:18px;line-height:1.1}
    .section-copy{
      font-size:14px;
      color:var(--muted);
      max-width:60ch
    }
    .calendar-head,.session-row{
      display:grid;
      grid-template-columns:110px 1fr 90px;
      gap:12px;
      align-items:center
    }
    .calendar-head{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:var(--muted);
      padding-bottom:12px;
      border-bottom:1px solid var(--divider);
      margin-bottom:12px
    }
    .session-list{
      display:grid;
      gap:12px
    }
    .session-row{
      padding:16px;
      background:var(--surface-2);
      border-radius:12px;
      border:1px solid color-mix(in oklab,var(--text) 8%, transparent)
    }
    .date,.badge,.small{
      font-size:12px;
      font-variant-numeric:tabular-nums lining-nums
    }
    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:.35rem .6rem;
      border-radius:9999px;
      background:var(--primary-highlight);
      color:var(--primary);
      font-weight:700
    }
    .small{color:var(--muted)}
    .session-title{
      font-size:14px;
      font-weight:700
    }
    .session-notes{
      font-size:14px;
      color:var(--muted);
      margin-top:4px
    }
    .stack{
      display:grid;
      gap:16px
    }
    .theme-toggle{
      width:44px;
      height:44px;
      border-radius:9999px;
      display:grid;
      place-items:center;
      background:var(--surface);
      border:1px solid color-mix(in oklab,var(--text) 10%,
